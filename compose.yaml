---
services:
  php:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      # Spotify n'accepte que 127.0.0.1 (pas "localhost") comme redirect URI locale
      SERVER_NAME: ${SERVER_NAME:-127.0.0.1}, php:80
      DEFAULT_URI: https://${SERVER_NAME:-127.0.0.1}:${HTTPS_PORT:-443}
      # Les clients n'envoient pas de SNI pour une IP : Caddy doit savoir quel certificat servir
      CADDY_GLOBAL_OPTIONS: default_sni ${SERVER_NAME:-127.0.0.1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-18}&charset=${POSTGRES_CHARSET:-utf8}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp

  # Consomme les messages Messenger. Même image que php, sans Caddy.
  worker:
    build:
      context: ./api
    restart: unless-stopped
    command: [ "php", "bin/console", "messenger:consume", "async", "--memory-limit=128M" ]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-18}&charset=${POSTGRES_CHARSET:-utf8}
    depends_on:
      # php joue composer install et les migrations au démarrage : on attend qu'il ait fini
      php:
        condition: service_healthy
    # Le HEALTHCHECK de l'image interroge Caddy, qui ne tourne pas ici
    healthcheck:
      test: [ "CMD", "php", "-r", "exit(str_contains(file_get_contents('/proc/1/cmdline'), 'messenger:consume') ? 0 : 1);" ]
      interval: 10s
      start_period: 30s

  database:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}" ]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      # Postgres 18+ : le volume se monte sur /var/lib/postgresql (et non plus .../data)
      - database_data:/var/lib/postgresql:rw

volumes:
  caddy_data:
  caddy_config:
  database_data:

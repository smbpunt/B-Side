security:
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: spotifyId

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\SpotifyAuthenticator
            entry_point: App\Security\SpotifyAuthenticator
            logout:
                path: api_auth_logout
                target: /
            # « Se souvenir de moi » : activé par SpotifyAuthenticator, reconduit à chaque reconnexion par cookie
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 jours
                # Jetons en base (table rememberme_token) : la déconnexion supprime le jeton côté serveur,
                # et un cookie volé puis réutilisé est détecté (tous les jetons de la série sont supprimés)
                token_provider:
                    doctrine: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/auth, roles: PUBLIC_ACCESS }
        # Retour de Spotify : sans session, le contrôleur renvoie vers la connexion
        - { path: ^/api/accounts/link/callback$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }

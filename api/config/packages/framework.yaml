# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    # En base et sans verrou : voir services.yaml
    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        # Expire après 1 h sans requête (24 min par défaut). Au-delà : cookie remember_me, voir security.yaml
        gc_maxlifetime: 3600

    #esi: true
    #fragments: true

    http_client:
        scoped_clients:
            # Autowiring : #[Target('spotify.client')] HttpClientInterface $client
            spotify.client:
                base_uri: 'https://api.spotify.com/v1/'
                # 429 (quota) : nouvel essai après le délai demandé par Spotify
                retry_failed:
                    max_retries: 3
            # Extraits au survol : on préfère pas d'extrait à un survol qui traîne
            deezer.client:
                base_uri: 'https://api.deezer.com/'
                max_duration: 3

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
